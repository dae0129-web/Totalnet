<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資產追蹤</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  margin: 0;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
}

button {
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.btn {
  background: #007bff;
  color: white;
}

input {
  width: 100%;
  padding: 8px;
  margin-bottom: 8px;
}
</style>
</head>

<body>

<div class="container">

  <h2>股票管理</h2>

  <div class="card">
    <select id="market">
      <option value="TW">上市</option>
      <option value="OTC">上櫃</option>
      <option value="ESB">興櫃</option>
      <option value="US">美股</option>
    </select>

    <input id="ticker" placeholder="股票代號">
    <input id="price" placeholder="價格" type="number">
    <input id="qty" placeholder="股數" type="number">

    <button class="btn" onclick="addStock()">新增</button>
  </div>

  <div class="card">
    <button class="btn" onclick="autoFetch()">⚡ 自動抓價格</button>
  </div>

  <div id="list"></div>

</div>

<script>

let stocks = []

function addStock(){
  const ticker = document.getElementById('ticker').value
  const price = Number(document.getElementById('price').value)
  const qty = Number(document.getElementById('qty').value)
  const market = document.getElementById('market').value

  stocks.push({ticker, price, qty, market})
  render()
}

function render(){
  const el = document.getElementById('list')

  el.innerHTML = stocks.map(s => `
    <div class="card">
      ${s.market} ${s.ticker}<br>
      價格: ${s.price} / 股數: ${s.qty}
    </div>
  `).join('')
}

async function fetchJson(url){
  try{
    const res = await fetch(url)
    return await res.json()
  }catch{
    return []
  }
}

function normalize(rows){
  const map = {}

  rows.forEach(r=>{
    const code = String(
      r.Code ||
      r.code ||
      r.SecuritiesCompanyCode ||
      r['代號'] ||
      r['股票代號'] ||
      ''
    ).trim()

    const price = parseFloat(
      (r.ClosingPrice ||
       r.Close ||
       r['收盤價'] ||
       r['成交價格'] ||
       r['最新成交價'] ||
       r.LatestPrice ||
       '').toString().replace(/,/g,'')
    )

    if(code && !isNaN(price)){
      map[code] = price
    }
  })

  return map
}

async function autoFetch(){

  const tw = normalize(await fetchJson('./data/twse_stock_day_all.json'))
  const otc = normalize(await fetchJson('./data/tpex_otc_day_all.json'))
  const esb = normalize(await fetchJson('./data/tpex_esb_day_all.json'))

  stocks = stocks.map(s=>{
    let p = null

    if(s.market === 'TW') p = tw[s.ticker]
    if(s.market === 'OTC') p = otc[s.ticker]
    if(s.market === 'ESB') p = esb[s.ticker]

    if(p){
      return {...s, price: p}
    }
    return s
  })

  render()
  alert('更新完成')
}

</script>

</body>
</html>
