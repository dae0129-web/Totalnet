<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="資產追蹤">
<title>總資產追蹤</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

html, body {
background: #0a0a12;
color: #e8e8f0;
font-family: ‘DM Sans’, ‘Noto Sans TC’, sans-serif;
min-height: 100vh;
-webkit-font-smoothing: antialiased;
}

.app { max-width: 480px; margin: 0 auto; padding-bottom: 120px; min-height: 100vh; background: linear-gradient(160deg, #0a0a12 0%, #11111e 60%, #0d0d1a 100%); }

/* ── Nav ── */
.main-nav { display: flex; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06); }
.nav-btn { flex: 1; padding: 14px 0; border: none; background: transparent; color: #6b6b80; font-size: 12px; font-family: ‘DM Sans’,‘Noto Sans TC’,sans-serif; cursor: pointer; letter-spacing: 0.5px; border-bottom: 2px solid transparent; transition: all 0.2s; }
.nav-btn.active { color: #d4af37; border-bottom-color: #d4af37; }

/* ── Header ── */
.header { padding: 32px 24px 0; }
.header .eyebrow { color: #6b6b80; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
.header h1 { font-family: ‘Playfair Display’, serif; font-size: 26px; font-weight: 700; color: #f0ecd8; letter-spacing: -0.5px; margin-top: 4px; }

/* ── Stats ── */
.stats { display: flex; gap: 12px; padding: 16px 24px 0; }
.stat-card { flex: 1; border-radius: 16px; padding: 14px 16px; }
.stat-card.primary { background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.25); }
.stat-card.secondary { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
.stat-card.success { background: rgba(76,175,130,0.12); border: 1px solid rgba(76,175,130,0.25); }
.stat-card.danger { background: rgba(224,92,92,0.12); border: 1px solid rgba(224,92,92,0.25); }
.stat-label { font-size: 10px; color: #6b6b80; letter-spacing: 1.5px; text-transform: uppercase; }
.stat-value { font-family: ‘Playfair Display’, serif; font-size: 20px; color: #d4af37; margin-top: 6px; font-weight: 700; word-break: break-all; }
.stat-card.secondary .stat-value { color: #c8c0e0; }
.stat-card.success .stat-value { color: #4caf82; }
.stat-card.danger .stat-value { color: #e05c5c; }
.stat-sub { font-size: 11px; margin-top: 4px; color: #6b6b80; }
.up { color: #4caf82; } .down { color: #e05c5c; } .neutral { color: #6b6b80; }

/* ── Tabs ── */
.tabs { display: flex; margin: 16px 24px 0; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 4px; }
.tab { flex: 1; padding: 9px 0; border-radius: 9px; border: none; cursor: pointer; font-size: 12px; font-weight: 500; font-family: ‘DM Sans’,‘Noto Sans TC’,sans-serif; background: transparent; color: #6b6b80; transition: all 0.2s; }
.tab.active { background: rgba(212,175,55,0.15); color: #d4af37; }

/* ── Chart ── */
.chart-wrap { padding: 16px 12px 0; display: none; }
.chart-wrap.visible { display: block; }
.chart-empty { text-align: center; padding: 40px 24px; color: #6b6b80; }
.chart-empty .icon { font-size: 36px; }
.chart-empty p { margin-top: 10px; line-height: 1.6; font-size: 14px; }

/* ── Log ── */
.log-wrap { padding: 14px 24px 0; display: none; }
.log-wrap.visible { display: block; }
.log-empty { text-align: center; padding: 40px 0; color: #6b6b80; font-size: 14px; }
.entry { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 13px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.entry-left .date { font-size: 11px; color: #6b6b80; }
.entry-left .amount { font-family: ‘Playfair Display’, serif; font-size: 19px; color: #d4af37; margin-top: 3px; }
.entry-left .note { font-size: 11px; color: #8888a0; margin-top: 4px; }
.entry-actions { display: flex; gap: 8px; flex-shrink: 0; }
.btn-edit { background: rgba(212,175,55,0.15); border: none; border-radius: 8px; color: #d4af37; padding: 7px 12px; font-size: 13px; cursor: pointer; }
.btn-del { background: rgba(224,92,92,0.1); border: none; border-radius: 8px; color: #e05c5c; padding: 7px 12px; font-size: 13px; cursor: pointer; }

/* ── Stock Holdings ── */
.section-title { font-size: 11px; color: #6b6b80; letter-spacing: 2px; text-transform: uppercase; padding: 16px 24px 8px; }
.holding-card { margin: 0 24px 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px 16px; }
.holding-top { display: flex; justify-content: space-between; align-items: flex-start; }
.holding-ticker { font-family: ‘Playfair Display’, serif; font-size: 18px; color: #f0ecd8; font-weight: 700; }
.holding-badge { font-size: 10px; padding: 3px 8px; border-radius: 20px; margin-left: 8px; vertical-align: middle; }
.badge-tw { background: rgba(76,175,130,0.15); color: #4caf82; border: 1px solid rgba(76,175,130,0.3); }
.badge-us { background: rgba(100,149,237,0.15); color: #6495ed; border: 1px solid rgba(100,149,237,0.3); }
.holding-name { font-size: 12px; color: #6b6b80; margin-top: 2px; }
.holding-shares { font-size: 13px; color: #a0a0b8; margin-top: 6px; }
.holding-right { text-align: right; }
.holding-value { font-family: ‘Playfair Display’, serif; font-size: 17px; color: #d4af37; }
.holding-pnl { font-size: 12px; margin-top: 3px; }
.holding-actions { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); }
.btn-price { flex: 1; background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.2); border-radius: 8px; color: #d4af37; padding: 8px; font-size: 12px; cursor: pointer; font-family: ‘DM Sans’,‘Noto Sans TC’,sans-serif; }
.btn-remove { background: rgba(224,92,92,0.08); border: 1px solid rgba(224,92,92,0.15); border-radius: 8px; color: #e05c5c; padding: 8px 12px; font-size: 12px; cursor: pointer; }

/* ── FAB ── */
.fab { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #d4af37, #b8941f); border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 26px; color: #0a0a12; cursor: pointer; box-shadow: 0 6px 28px rgba(212,175,55,0.4); display: flex; align-items: center; justify-content: center; font-weight: 700; z-index: 50; }

/* ── Overlay / Sheet ── */
.overlay { position: fixed; inset: 0; background: rgba(5,5,12,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: flex-end; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.overlay.show { opacity: 1; pointer-events: all; }
.sheet { width: 100%; max-width: 480px; margin: 0 auto; background: linear-gradient(180deg,#18182e,#12121f); border-radius: 24px 24px 0 0; border: 1px solid rgba(212,175,55,0.2); padding: 26px 24px 44px; transform: translateY(30px); transition: transform 0.3s ease; }
.overlay.show .sheet { transform: translateY(0); }
.sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.sheet-title { font-family: ‘Playfair Display’, serif; font-size: 19px; color: #f0ecd8; }
.btn-close { background: rgba(255,255,255,0.06); border: none; border-radius: 50%; width: 32px; height: 32px; color: #888; cursor: pointer; font-size: 15px; }

.field-label { font-size: 11px; color: #6b6b80; letter-spacing: 1.5px; text-transform: uppercase; display: block; margin-bottom: 6px; }
.field-wrap { margin-bottom: 14px; }
.input-base { display: block; width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 16px; color: #e8e8f0; font-size: 15px; font-family: ‘DM Sans’,‘Noto Sans TC’,sans-serif; outline: none; -webkit-appearance: none; appearance: none; }
.input-base:focus { border-color: rgba(212,175,55,0.35); }
.input-row { display: flex; gap: 10px; }
.input-row .field-wrap { flex: 1; }
.amount-wrap { position: relative; }
.currency-symbol { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #d4af37; font-size: 15px; pointer-events: none; }
.input-amount { padding-left: 34px; color: #d4af37; font-family: ‘Playfair Display’, serif; font-size: 20px; border-color: rgba(212,175,55,0.25); }
.btn-submit { width: 100%; padding: 15px; border-radius: 14px; border: none; background: linear-gradient(135deg, #d4af37, #b8941f); color: #0a0a12; font-size: 15px; font-weight: 600; cursor: pointer; font-family: ‘DM Sans’,‘Noto Sans TC’,sans-serif; margin-top: 6px; }
.seg { display: flex; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
.seg-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; background: transparent; color: #6b6b80; font-size: 13px; cursor: pointer; font-family: ‘DM Sans’,‘Noto Sans TC’,sans-serif; transition: all 0.2s; }
.seg-btn.active { background: rgba(212,175,55,0.15); color: #d4af37; }

/* ── Confirm ── */
.confirm-overlay { position: fixed; inset: 0; background: rgba(5,5,12,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 24px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.confirm-overlay.show { opacity: 1; pointer-events: all; }
.confirm-box { background: #16162a; border: 1px solid rgba(224,92,92,0.3); border-radius: 20px; padding: 26px 24px; width: 100%; max-width: 320px; text-align: center; }
.confirm-icon { font-size: 34px; }
.confirm-title { font-size: 16px; color: #e8e8f0; margin: 10px 0 5px; font-weight: 500; }
.confirm-sub { font-size: 13px; color: #6b6b80; margin-bottom: 22px; }
.confirm-btns { display: flex; gap: 10px; }
.btn-cancel { flex: 1; padding: 11px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: transparent; color: #8888a0; cursor: pointer; font-size: 14px; }
.btn-confirm-del { flex: 1; padding: 11px; border-radius: 12px; border: none; background: #e05c5c; color: #fff; cursor: pointer; font-size: 14px; font-weight: 600; }

/* ── Toast ── */
.toast { position: fixed; bottom: 104px; left: 50%; transform: translateX(-50%) translateY(10px); background: rgba(212,175,55,0.95); color: #0a0a12; padding: 9px 20px; border-radius: 50px; font-size: 13px; font-weight: 600; z-index: 300; white-space: nowrap; opacity: 0; transition: all 0.25s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── FX row ── */
.fx-row { display: flex; align-items: center; gap: 10px; margin: 0 24px 14px; background: rgba(100,149,237,0.08); border: 1px solid rgba(100,149,237,0.2); border-radius: 12px; padding: 10px 14px; }
.fx-label { font-size: 12px; color: #6495ed; flex: 1; }
.fx-input { background: transparent; border: none; border-bottom: 1px solid rgba(100,149,237,0.3); color: #6495ed; font-size: 14px; font-family: ‘Playfair Display’, serif; width: 70px; text-align: right; outline: none; padding: 2px 4px; }

input[type=“number”]::-webkit-inner-spin-button,
input[type=“number”]::-webkit-outer-spin-button { -webkit-appearance: none; }
</style>

</head>

<script>
// ══════════════════════════════════════════
// Storage keys
// ══════════════════════════════════════════
const WK = 'tw-wealth-v2';
const SK = 'tw-stock-v2';
const FXK = 'tw-fx-v1';

// ══════════════════════════════════════════
// State
// ══════════════════════════════════════════
let wEntries = [];   // [{id, date, amount, note}]
let holdings = [];   // [{id, ticker, name, shares, market}]
let priceLog = {};   // {date: {tickerId: price}}
let fxRate   = 32;

let wEditId      = null;
let confirmCb    = null;
let currentPage  = 'wealth';
let wTab         = 'chart';
let sTab         = 'chart';
let newStockMkt  = 'TW';
let pricingStockId = null; // null = all stocks

let wChartInst = null;
let sChartInst = null;

// ══════════════════════════════════════════
// Init
// ══════════════════════════════════════════
function init() {
  try { wEntries = JSON.parse(localStorage.getItem(WK)) || []; } catch { wEntries = []; }
  try { const s = JSON.parse(localStorage.getItem(SK)); if(s){holdings=s.holdings||[];priceLog=s.priceLog||{};} } catch {}
  try { fxRate = parseFloat(localStorage.getItem(FXK)) || 32; } catch {}
  document.getElementById('fxRate').value = fxRate;
  setToday();
  renderWealth();
  renderStock();
}

function saveWealth() { localStorage.setItem(WK, JSON.stringify(wEntries)); }
function saveStock()  { localStorage.setItem(SK, JSON.stringify({holdings, priceLog})); }
function saveFx()     { fxRate = parseFloat(document.getElementById('fxRate').value) || 32; localStorage.setItem(FXK, fxRate); renderStock(); }

function setToday() {
  const t = new Date().toISOString().slice(0,10);
  document.getElementById('wInputDate').value = t;
  document.getElementById('sPriceDate').value = t;
}

// ══════════════════════════════════════════
// Utils
// ══════════════════════════════════════════
function today() { return new Date().toISOString().slice(0,10); }
function fmtN(v) { return Math.round(v).toLocaleString('zh-TW'); }
function fmtShort(v) {
  if(v>=1000000) return '$'+(v/1000000).toFixed(2)+'M';
  if(v>=1000) return '$'+(v/1000).toFixed(1)+'K';
  return '$'+fmtN(v);
}
function fmtDate(s) { const d=new Date(s+'T00:00:00'); return (d.getMonth()+1)+'/'+d.getDate(); }
function showToast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

// ══════════════════════════════════════════
// Page nav
// ══════════════════════════════════════════
function switchPage(page) {
  currentPage = page;
  document.getElementById('wealthPage').style.display = page==='wealth' ? '' : 'none';
  document.getElementById('stockPage').style.display  = page==='stock'  ? '' : 'none';
  document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',(i===0)===(page==='wealth')));
}

// ══════════════════════════════════════════
// FAB
// ══════════════════════════════════════════
function onFab() {
  if(currentPage==='wealth') openWForm();
  else openSAction();
}
function openSAction() {
  // If no holdings, go straight to add stock
  if(!holdings.length) { openSAdd(); return; }
  openPriceForm(null);
}

// ══════════════════════════════════════════
// ── WEALTH ──
// ══════════════════════════════════════════
function switchWTab(t) {
  wTab=t;
  document.querySelectorAll('#wealthPage .tab').forEach((el,i)=>el.classList.toggle('active',(i===0)===(t==='chart')));
  document.getElementById('wChartWrap').classList.toggle('visible',t==='chart');
  document.getElementById('wLogWrap').classList.toggle('visible',t==='log');
}

function openWForm(entry) {
  wEditId = entry ? entry.id : null;
  document.getElementById('wFormTitle').textContent = entry ? '編輯紀錄' : '登錄資產';
  document.getElementById('wInputDate').value   = entry ? entry.date : today();
  document.getElementById('wInputAmount').value = entry ? entry.amount : '';
  document.getElementById('wInputNote').value   = entry ? (entry.note||'') : '';
  document.querySelector('#wFormOverlay .btn-submit').textContent = entry ? '更新' : '儲存紀錄';
  document.getElementById('wFormOverlay').classList.add('show');
}
function closeWForm() { document.getElementById('wFormOverlay').classList.remove('show'); wEditId=null; }
function wOverlayClose(e) { if(e.target===document.getElementById('wFormOverlay')) closeWForm(); }

function submitWForm() {
  const raw=document.getElementById('wInputAmount').value.trim();
  const amount=Math.round(parseFloat(raw));
  const date=document.getElementById('wInputDate').value;
  const note=document.getElementById('wInputNote').value.trim();
  if(!raw||isNaN(amount)||amount<0){showToast('請輸入有效金額');return;}
  if(!date){showToast('請選擇日期');return;}
  if(wEditId) {
    wEntries=wEntries.map(e=>e.id===wEditId?{...e,amount,date,note}:e);
    showToast('已更新 ✓');
  } else {
    const ex=wEntries.find(e=>e.date===date);
    if(ex){wEntries=wEntries.map(e=>e.date===date?{...e,amount,note}:e);showToast('已更新當日紀錄 ✓');}
    else{wEntries.push({id:Date.now().toString(),date,amount,note});showToast('已記錄 ✓');}
  }
  saveWealth(); renderWealth(); closeWForm();
}

function renderWealth() {
  const sorted=[...wEntries].sort((a,b)=>a.date.localeCompare(b.date));
  const latest=sorted[sorted.length-1], prev=sorted[sorted.length-2];
  document.getElementById('wStatLatest').textContent=latest?fmtShort(latest.amount):'—';
  document.getElementById('wStatCount').textContent=wEntries.length+' 筆紀錄';
  if(latest&&prev){
    const diff=latest.amount-prev.amount, pct=(diff/prev.amount*100).toFixed(2);
    const el=document.getElementById('wStatChange');
    el.textContent=(diff>=0?'▲ ':'▼ ')+Math.abs(pct)+'%';
    el.className='stat-sub '+(diff>=0?'up':'down');
  } else document.getElementById('wStatChange').textContent='';
  document.getElementById('wStatATH').textContent=wEntries.length?fmtShort(Math.max(...wEntries.map(e=>e.amount))):'—';
  renderWChart(sorted);
  renderWLog(sorted);
}

function renderWChart(sorted) {
  const canvas=document.getElementById('wChart'), empty=document.getElementById('wChartEmpty');
  if(sorted.length<2){canvas.style.display='none';empty.style.display='block';if(wChartInst){wChartInst.destroy();wChartInst=null;}return;}
  canvas.style.display='block';empty.style.display='none';
  const labels=sorted.map(e=>fmtDate(e.date)), data=sorted.map(e=>Math.round(e.amount));
  const minA=Math.min(...data),maxA=Math.max(...data),pad=(maxA-minA)*0.18||maxA*0.1||1000;
  if(wChartInst) wChartInst.destroy();
  wChartInst=new Chart(canvas,{
    type:'line',
    data:{labels,datasets:[{data,borderColor:'#d4af37',borderWidth:2.5,pointBackgroundColor:'#d4af37',pointRadius:4,pointHoverRadius:7,tension:0.3,fill:true,
      backgroundColor:(ctx)=>{const g=ctx.chart.ctx.createLinearGradient(0,0,0,220);g.addColorStop(0,'rgba(212,175,55,0.18)');g.addColorStop(1,'rgba(212,175,55,0)');return g;}}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(10,10,18,0.95)',borderColor:'rgba(212,175,55,0.35)',borderWidth:1,titleColor:'#a0a0b0',bodyColor:'#d4af37',bodyFont:{family:'Playfair Display,serif',size:16},padding:12,callbacks:{label:ctx=>'$ '+ctx.parsed.y.toLocaleString('zh-TW')+' 元'}}},
    scales:{x:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#6b6b80',font:{size:11}}},y:{min:Math.max(0,minA-pad),max:maxA+pad,grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#6b6b80',font:{size:10},callback:v=>Math.round(v).toLocaleString('zh-TW')}}}}
  });
}

function renderWLog(sorted) {
  const list=document.getElementById('wLogList'), empty=document.getElementById('wLogEmpty');
  const rev=[...sorted].reverse();
  if(!rev.length){empty.style.display='block';list.innerHTML='';return;}
  empty.style.display='none';
  list.innerHTML=rev.map(e=>`
    <div class="entry">
      <div class="entry-left">
        <div class="date">${e.date}</div>
        <div class="amount">$ ${fmtN(e.amount)} 元</div>
        ${e.note?'<div class="note">'+e.note+'</div>':''}
      </div>
      <div class="entry-actions">
        <button class="btn-edit" onclick="openWForm(wEntries.find(x=>x.id==='${e.id}'))">✏️</button>
        <button class="btn-del" onclick="askConfirm('確認刪除此筆資產紀錄？',()=>deleteWEntry('${e.id}'))">🗑</button>
      </div>
    </div>`).join('');
}

function deleteWEntry(id) { wEntries=wEntries.filter(e=>e.id!==id); saveWealth(); renderWealth(); showToast('已刪除'); }

// ══════════════════════════════════════════
// ── STOCK ──
// ══════════════════════════════════════════
function switchSTab(t) {
  sTab=t;
  document.querySelectorAll('#stockPage .tab').forEach((el,i)=>el.classList.toggle('active',(i===0)===(t==='chart')));
  document.getElementById('sChartWrap').classList.toggle('visible',t==='chart');
  document.getElementById('sHoldingsWrap').style.display=t==='holdings'?'':'none';
}

// Add stock
function openSAdd() {
  selectMarket('TW');
  document.getElementById('sInputTicker').value='';
  document.getElementById('sInputShares').value='';
  document.getElementById('sInputName').value='';
  document.getElementById('sAddOverlay').classList.add('show');
}
function closeSAdd() { document.getElementById('sAddOverlay').classList.remove('show'); }
function sAddOverlayClose(e) { if(e.target===document.getElementById('sAddOverlay')) closeSAdd(); }
function selectMarket(m) {
  newStockMkt=m;
  document.getElementById('segTW').classList.toggle('active',m==='TW');
  document.getElementById('segUS').classList.toggle('active',m==='US');
}
function submitSAdd() {
  const ticker=document.getElementById('sInputTicker').value.trim().toUpperCase();
  const shares=parseFloat(document.getElementById('sInputShares').value);
  const name=document.getElementById('sInputName').value.trim();
  if(!ticker){showToast('請輸入股票代號');return;}
  if(!shares||shares<=0){showToast('請輸入有效股數');return;}
  if(holdings.find(h=>h.ticker===ticker&&h.market===newStockMkt)){showToast('已存在此股票');return;}
  holdings.push({id:Date.now().toString(),ticker,name,shares,market:newStockMkt});
  saveStock(); renderStock(); closeSAdd();
  showToast(ticker+' 已新增 ✓');
  // Prompt to log price
  setTimeout(()=>openPriceForm(null),400);
}

// Price form
function openPriceForm(stockId) {
  pricingStockId=stockId;
  const date=today();
  document.getElementById('sPriceDate').value=date;
  buildPriceFields(stockId, date);
  document.getElementById('sPriceOverlay').classList.add('show');
}
function closePrice() { document.getElementById('sPriceOverlay').classList.remove('show'); }
function sPriceOverlayClose(e) { if(e.target===document.getElementById('sPriceOverlay')) closePrice(); }

function buildPriceFields(stockId, date) {
  const targets = stockId ? holdings.filter(h=>h.id===stockId) : holdings;
  const fields = document.getElementById('sPriceFields');
  const dayLog = priceLog[date] || {};
  fields.innerHTML = targets.map(h=>`
    <div class="field-wrap">
      <label class="field-label">${h.ticker} ${h.name?'('+h.name+')':''} <span style="color:${h.market==='TW'?'#4caf82':'#6495ed'};font-size:10px;">${h.market==='TW'?'台股 TWD':'美股 USD'}</span></label>
      <div class="amount-wrap">
        <span class="currency-symbol" style="color:${h.market==='TW'?'#4caf82':'#6495ed'}">${h.market==='TW'?'$':'$'}</span>
        <input type="number" id="price_${h.id}" class="input-base input-amount" placeholder="0" inputmode="decimal" value="${dayLog[h.id]||''}" style="border-color:${h.market==='TW'?'rgba(76,175,130,0.3)':'rgba(100,149,237,0.3)'};color:${h.market==='TW'?'#4caf82':'#6495ed'}">
      </div>
    </div>`).join('');
  // Also update date changes
  document.getElementById('sPriceDate').onchange = function() { buildPriceFields(stockId, this.value); };
}

function submitPrices() {
  const date=document.getElementById('sPriceDate').value;
  if(!date){showToast('請選擇日期');return;}
  const targets = pricingStockId ? holdings.filter(h=>h.id===pricingStockId) : holdings;
  if(!priceLog[date]) priceLog[date]={};
  let saved=0;
  targets.forEach(h=>{
    const el=document.getElementById('price_'+h.id);
    if(!el) return;
    const v=parseFloat(el.value);
    if(!isNaN(v)&&v>0){priceLog[date][h.id]=v;saved++;}
  });
  if(!saved){showToast('請至少輸入一個價格');return;}
  saveStock(); renderStock(); closePrice();
  showToast('價格已儲存 ✓');
}

// Compute daily portfolio value in TWD
function computeDailyValues() {
  const dates = Object.keys(priceLog).sort();
  return dates.map(date=>{
    const dayLog=priceLog[date];
    let total=0;
    holdings.forEach(h=>{
      const price=dayLog[h.id];
      if(price==null) return;
      const valueTWD = h.market==='TW' ? price*h.shares : price*h.shares*fxRate;
      total+=valueTWD;
    });
    return {date, value:Math.round(total)};
  }).filter(d=>d.value>0);
}

function renderStock() {
  const daily=computeDailyValues();
  const latest=daily[daily.length-1], prev=daily[daily.length-2];

  // Stats
  if(latest){
    document.getElementById('sStatValue').textContent=fmtShort(latest.value);
    document.getElementById('sStatDate').textContent=latest.date;
  } else {
    document.getElementById('sStatValue').textContent='—';
    document.getElementById('sStatDate').textContent='尚無價格紀錄';
  }
  if(latest&&prev){
    const diff=latest.value-prev.value, pct=(diff/prev.value*100).toFixed(2);
    document.getElementById('sStatPnl').textContent=(diff>=0?'+':'')+fmtShort(Math.abs(diff));
    document.getElementById('sStatPnlPct').textContent=(diff>=0?'▲ ':'▼ ')+Math.abs(pct)+'%';
    document.getElementById('sStatPnl').className='stat-value '+(diff>=0?'up':'down');
    document.getElementById('sStatPnlCard').className='stat-card '+(diff>=0?'success':'danger');
  } else {
    document.getElementById('sStatPnl').textContent='—';
    document.getElementById('sStatPnlPct').textContent='需要 2 天以上資料';
    document.getElementById('sStatPnl').className='stat-value';
    document.getElementById('sStatPnlCard').className='stat-card secondary';
  }

  renderSChart(daily);
  renderHoldings();
}

function renderSChart(daily) {
  const canvas=document.getElementById('sChart'), empty=document.getElementById('sChartEmpty');
  if(daily.length<2){canvas.style.display='none';empty.style.display='block';if(sChartInst){sChartInst.destroy();sChartInst=null;}return;}
  canvas.style.display='block';empty.style.display='none';
  const labels=daily.map(d=>fmtDate(d.date));
  const values=daily.map(d=>d.value);
  const pnlData=values.map((v,i)=>i===0?0:v-values[i-1]);
  const minP=Math.min(...pnlData), maxP=Math.max(...pnlData);
  const pad=(maxP-minP)*0.2||Math.max(Math.abs(minP),Math.abs(maxP))*0.2||1000;
  if(sChartInst) sChartInst.destroy();
  sChartInst=new Chart(canvas,{
    type:'line',
    data:{labels,datasets:[{
      data:pnlData,
      borderColor:(ctx)=>{
        const v=pnlData[ctx.dataIndex];
        return v>=0?'#4caf82':'#e05c5c';
      },
      segment:{borderColor:ctx=>pnlData[ctx.p1DataIndex]>=0?'#4caf82':'#e05c5c'},
      pointBackgroundColor:pnlData.map(v=>v>=0?'#4caf82':'#e05c5c'),
      pointRadius:4,pointHoverRadius:7,borderWidth:2.5,tension:0.3,fill:false
    }]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(10,10,18,0.95)',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,titleColor:'#a0a0b0',bodyFont:{family:'Playfair Display,serif',size:15},padding:12,
      callbacks:{label:ctx=>{const v=ctx.parsed.y;return(v>=0?'▲ +':'▼ ')+Math.round(Math.abs(v)).toLocaleString('zh-TW')+' 元';}}}},
    scales:{x:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#6b6b80',font:{size:11}}},
    y:{min:minP-pad,max:maxP+pad,grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#6b6b80',font:{size:10},callback:v=>{const abs=Math.abs(Math.round(v));if(abs>=1000000)return(v>=0?'+':'-')+(abs/1000000).toFixed(1)+'M';if(abs>=1000)return(v>=0?'+':'-')+(abs/1000).toFixed(0)+'K';return(v>=0?'+':'')+Math.round(v).toLocaleString('zh-TW');}}}}}
  });
}

function renderHoldings() {
  const list=document.getElementById('sHoldingsList');
  const empty=document.getElementById('sHoldingsEmpty');
  if(!holdings.length){empty.style.display='block';list.innerHTML='';list.appendChild(empty);return;}
  empty.style.display='none';
  const latestDate=Object.keys(priceLog).sort().pop();
  const prevDate=Object.keys(priceLog).sort().slice(-2,-1)[0];
  const dayLog=latestDate?priceLog[latestDate]:{};
  const prevLog=prevDate?priceLog[prevDate]:{};

  list.innerHTML=holdings.map(h=>{
    const price=dayLog[h.id];
    const prev=prevLog[h.id];
    const valueTWD=price?(h.market==='TW'?price*h.shares:price*h.shares*fxRate):null;
    const prevTWD=prev?(h.market==='TW'?prev*h.shares:prev*h.shares*fxRate):null;
    const diff=valueTWD&&prevTWD?valueTWD-prevTWD:null;
    const pct=diff&&prevTWD?(diff/prevTWD*100).toFixed(2):null;
    return `<div class="holding-card">
      <div class="holding-top">
        <div>
          <span class="holding-ticker">${h.ticker}</span>
          <span class="holding-badge ${h.market==='TW'?'badge-tw':'badge-us'}">${h.market==='TW'?'台股':'美股'}</span>
          ${h.name?'<div class="holding-name">'+h.name+'</div>':''}
          <div class="holding-shares">${h.shares.toLocaleString()} 股${price?'　@ '+(h.market==='TW'?'$':'$')+price.toLocaleString('zh-TW'):''}  </div>
        </div>
        <div class="holding-right">
          <div class="holding-value">${valueTWD?'$'+fmtN(valueTWD):'—'}</div>
          ${diff!==null?'<div class="holding-pnl '+(diff>=0?'up':'down')+'">'+(diff>=0?'▲ +':'▼ ')+fmtShort(Math.abs(diff))+'（'+Math.abs(pct)+'%）</div>':'<div class="holding-pnl neutral">尚無昨日資料</div>'}
        </div>
      </div>
      <div class="holding-actions">
        <button class="btn-price" onclick="openPriceForm('${h.id}')">📝 登錄價格</button>
        <button class="btn-remove" onclick="askConfirm('確認刪除 ${h.ticker}？持股及所有價格紀錄將一併刪除。',()=>deleteHolding('${h.id}'))">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function deleteHolding(id) {
  holdings=holdings.filter(h=>h.id!==id);
  Object.keys(priceLog).forEach(d=>delete priceLog[d][id]);
  saveStock(); renderStock(); showToast('已刪除');
}

// ── Confirm dialog ──
function askConfirm(msg, cb) {
  confirmCb=cb;
  document.getElementById('confirmTitle').textContent=msg;
  document.getElementById('confirmOverlay').classList.add('show');
}
function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('show'); confirmCb=null; }
function doConfirm() { if(confirmCb) confirmCb(); closeConfirm(); }

// ── Stock page FAB: show action sheet ──
// (already handled by openSAction above)

init();
</script>
